services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashvision-api
    restart: unless-stopped
    environment:
      CASHVISION_ENVIRONMENT: ${CASHVISION_ENVIRONMENT:-production}
      CASHVISION_DEBUG: ${CASHVISION_DEBUG:-false}
      CASHVISION_DATABASE_URL: postgresql+asyncpg://cashvision:${POSTGRES_PASSWORD:-cashvision}@db:5432/cashvision
      CASHVISION_REDIS_URL: redis://redis:6379/0
      CASHVISION_RATE_LIMIT_PER_MINUTE: ${CASHVISION_RATE_LIMIT_PER_MINUTE:-60}
      CASHVISION_SERIAL_VERIFICATION_AVAILABLE: ${CASHVISION_SERIAL_VERIFICATION_AVAILABLE:-false}
      CASHVISION_MAX_FREE_SCANS_PER_DAY: ${CASHVISION_MAX_FREE_SCANS_PER_DAY:-5}
      CASHVISION_REMOTE_MODEL_ENABLED: ${CASHVISION_REMOTE_MODEL_ENABLED:-false}
      CASHVISION_LOG_LEVEL: ${CASHVISION_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cashvision-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: cashvision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashvision}
      POSTGRES_DB: cashvision
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - cashvision-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cashvision-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - cashvision-net
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    container_name: cashvision-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - cashvision-net

volumes:
  postgres-data:
  redis-data:

networks:
  cashvision-net:
    driver: bridge

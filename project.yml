name: CashVision
options:
  bundleIdPrefix: ai.cashvision
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_LANG_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: none
    ENABLE_MODULE_VERIFIER: NO
    BUILD_LIBRARY_FOR_DISTRIBUTION: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
configs:
  Debug: debug
  Release: release
targets:
  CashVision:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CashVision
        excludes:
          - "**/.DS_Store"
    info:
      path: CashVision/Resources/Info.plist
      properties:
        CFBundleDisplayName: CashVision
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Камера нужна для распознавания банкнот и проверки защитных признаков. Изображения не покидают устройство."
        NSPhotoLibraryUsageDescription: "Доступ к фото требуется только при сохранении снимков результатов по вашему запросу."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: []
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cashvision.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  CashVisionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Unit
    dependencies:
      - target: CashVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cashvision.app.tests
        GENERATE_INFOPLIST_FILE: YES
  CashVisionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UI
    dependencies:
      - target: CashVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cashvision.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CashVision:
    build:
      targets:
        CashVision: all
        CashVisionTests: [test]
        CashVisionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CashVisionTests
        - CashVisionUITests
    archive:
      config: Release

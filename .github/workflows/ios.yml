name: iOS Build & Test
on:
  push:
    branches: [main, develop, fix/comprehensive-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/contents/Developer
          xcodebuild -version
          swift --version

      - name: Show available simulators
        run: xcrun simctl list devices available | grep -E "iPhone (16|17|15)" | head -10

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (Debug, Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CashVision.xcodeproj \
            -scheme CashVision \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_output.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CashVision.xcodeproj \
            -scheme CashVision \
            -only-testing:CashVisionTests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit_test_output.log

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CashVision.xcodeproj \
            -scheme CashVision \
            -only-testing:CashVisionUITests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui_test_output.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            unit_test_output.log
            ui_test_output.log

      - name: Upload .app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CashVision-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/CashVision.app

name: iOS Build & Test
on:
  push:
    branches: [main, develop, fix/build-errors]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (Debug, Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CashVision.xcodeproj \
            -scheme CashVision \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_output.log

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CashVision.xcodeproj \
            -scheme CashVision \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test_output.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            test_output.log
            build/DerivedData/Logs/Test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/DerivedData/Logs/Test

name: iOS Build & Test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/contents/Developer

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -n 20

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (Debug, Simulator)
        run: |
          xcodebuild build \
            -project CashVision.xcodeproj \
            -scheme CashVision \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Run tests
        run: |
          xcodebuild test \
            -project CashVision.xcodeproj \
            -scheme CashVision \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/DerivedData/Logs/Test
